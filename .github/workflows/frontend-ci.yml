name: Frontend CI

on:
  push:
    branches: [main, developer]
    paths:
      - "techchallenge-irrah-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, developer]
    paths:
      - "techchallenge-irrah-frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techchallenge-irrah-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: techchallenge-irrah-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build application
        run: npm run build
