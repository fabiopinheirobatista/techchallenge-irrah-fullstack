spring.application.name=techchallenge-irrah-backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.threads.virtual.enabled=true

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bcb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bcb}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.auth.token-ttl=${APP_AUTH_TOKEN_TTL:24h}
app.messaging.processing-enabled=${APP_MESSAGING_PROCESSING_ENABLED:true}
app.messaging.processing-delay=${APP_MESSAGING_PROCESSING_DELAY:1000}
